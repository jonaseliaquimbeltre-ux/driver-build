name: Build RTL8188EU Kernel Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git crossbuild-essential-arm64 gcc-aarch64-linux-gnu

      - name: Clone Android Kernel
        run: |
          git clone --depth 1 -b android15-6.6 https://android.googlesource.com/kernel/common

      - name: Build Driver
        run: |
          cd common
          make ARCH=arm64 gki_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/staging/rtl8188eu modules -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: r8188eu-driver
          path: common/drivers/staging/rtl8188eu/r8188eu.ko
